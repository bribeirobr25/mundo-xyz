<svg xmlns="http://www.w3.org/2000/svg" width="440" height="480" viewBox="0 0 110 120">
  <defs>
    <filter id="edge" x="-14%" y="-14%" width="128%" height="128%">
      <feGaussianBlur stdDeviation="0.22"/>
    </filter>
    <radialGradient id="lit" gradientUnits="userSpaceOnUse" cx="42" cy="2" r="58">
      <stop offset="0" stop-color="{{lit}}"/>
      <stop offset="0.74" stop-color="{{lit}}"/>
      <stop offset="0.8" stop-color="{{lit}}" stop-opacity="0.22"/>
      <stop offset="0.86" stop-color="{{lit}}" stop-opacity="0"/>
      <stop offset="1" stop-color="{{lit}}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" gradientUnits="userSpaceOnUse" cx="76" cy="72" r="30">
      <stop offset="0" stop-color="{{leafShade}}" stop-opacity="0.9"/>
      <stop offset="0.34" stop-color="{{leafShade}}" stop-opacity="0.48"/>
      <stop offset="0.62" stop-color="{{leafShade}}" stop-opacity="0.14"/>
      <stop offset="1" stop-color="{{leafShade}}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cast" gradientUnits="userSpaceOnUse" cx="63" cy="106" r="30">
      <stop offset="0" stop-color="{{shadow}}" stop-opacity="0.78"/>
      <stop offset="0.48" stop-color="{{shadow}}" stop-opacity="0.42"/>
      <stop offset="0.8" stop-color="{{shadow}}" stop-opacity="0.1"/>
