      <path filter="url(#edge)" fill="#ffffff" d="M 55.0,17.1 L 58.4,16.8 L 61.5,18.1 L 64.6,19.1 L 68.0,19.8 L 71.0,21.3 L 73.2,23.9 L 76.4,25.5 L 78.4,28.3 L 80.4,31.0 L 81.3,34.4 L 82.5,37.5 L 84.2,40.6 L 84.8,44.0 L 85.1,47.4 L 83.9,50.8 L 84.2,54.2 L 83.3,57.6 L 81.3,60.4 L 79.6,63.3 L 78.4,66.5 L 75.8,68.7 L 73.2,70.9 L 70.5,72.8 L 68.0,75.0 L 64.9,76.5 L 61.5,76.7 L 58.3,77.2 L 55.0,77.7 L 51.6,78.0 L 48.5,76.7 L 45.4,75.7 L 42.0,75.0 L 39.0,73.5 L 36.8,70.9 L 33.6,69.3 L 31.6,66.5 L 29.6,63.8 L 28.7,60.4 L 27.5,57.3 L 25.8,54.2 L 25.2,50.8 L 24.9,47.4 L 26.1,44.0 L 25.8,40.6 L 26.7,37.2 L 28.7,34.4 L 30.4,31.5 L 31.6,28.3 L 34.2,26.1 L 36.8,23.9 L 39.5,22.0 L 42.0,19.8 L 45.1,18.3 L 48.5,18.1 L 51.7,17.6 Z"/>
