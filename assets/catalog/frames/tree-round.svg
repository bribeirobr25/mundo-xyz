<svg xmlns="http://www.w3.org/2000/svg" width="440" height="480" viewBox="0 0 110 120">
  <defs>
    <filter id="edge" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="0.2"/>
    </filter>
    <radialGradient id="lit" gradientUnits="userSpaceOnUse" cx="42" cy="2" r="58">
      <stop offset="0" stop-color="{{lit}}"/>
      <stop offset="0.72" stop-color="{{lit}}"/>
      <stop offset="0.8" stop-color="{{lit}}" stop-opacity="0"/>
      <stop offset="1" stop-color="{{lit}}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" gradientUnits="userSpaceOnUse" cx="76" cy="72" r="28">
      <stop offset="0" stop-color="{{leafShade}}" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="{{leafShade}}" stop-opacity="0.4"/>
      <stop offset="1" stop-color="{{leafShade}}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cast" gradientUnits="userSpaceOnUse" cx="63" cy="106" r="30">
      <stop offset="0" stop-color="{{shadow}}" stop-opacity="0.78"/>
      <stop offset="0.48" stop-color="{{shadow}}" stop-opacity="0.42"/>
      <stop offset="0.8" stop-color="{{shadow}}" stop-opacity="0.1"/>
      <stop offset="1" stop-color="{{shadow}}" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="4" result="paint"/>
      <feColorMatrix in="paint" type="matrix" values="0 0 0 0 0.16  0 0 0 0 0.4  0 0 0 0 0.12  0 0 0 0.28 0" result="paintTint"/>
      <feBlend in="SourceGraphic" in2="paintTint" mode="overlay" result="painted"/>
      <feTurbulence type="fractalNoise" baseFrequency="5.5" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.22  0 0 0 0 0.44  0 0 0 0 0.16  0 0 0 0.16 0" result="tint"/>
      <feBlend in="painted" in2="tint" mode="overlay"/>
    </filter>
    <mask id="soft" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="110" height="120" fill="#000000"/>
      <path filter="url(#edge)" fill="#ffffff" d="M 55.0,16.4 L 59.6,17.4 L 64.2,18.2 L 68.6,19.8 L 72.2,22.8 L 76.0,25.6 L 79.3,29.0 L 81.1,33.4 L 83.3,37.6 L 84.7,42.2 L 84.3,47.0 L 84.4,51.7 L 83.6,56.5 L 81.1,60.6 L 79.0,64.8 L 76.2,68.6 L 72.2,71.2 L 68.5,74.0 L 64.3,76.1 L 59.6,76.6 L 55.0,77.3 L 50.3,77.2 L 45.9,75.5 L 41.5,74.0 L 37.3,71.7 L 34.3,68.2 L 31.0,64.8 L 28.2,60.9 L 27.1,56.3 L 25.6,51.7 L 24.9,47.0 L 26.0,42.3 L 26.7,37.6 L 28.2,33.1 L 31.3,29.4 L 34.0,25.6 L 37.3,22.3 L 41.7,20.3 L 45.8,18.2 L 50.3,16.8 Z"/>
    </mask>
  </defs>
  <ellipse cx="63" cy="106" rx="24" ry="9" fill="url(#cast)"/>
  <polygon points="56.2,76 58.6,76 57.4,102 56.2,102" fill="{{trunkShade}}"/>
  <polygon points="51.6,76 57.4,76 56.2,102 53.2,102" fill="{{trunk}}"/>
  <g mask="url(#soft)" filter="url(#grain)">
    <ellipse cx="55" cy="47" rx="34" ry="36" fill="{{leaf}}"/>
    <ellipse cx="70" cy="64" rx="24" ry="18" fill="url(#shade)"/>
    <ellipse cx="48" cy="32" rx="36" ry="30" fill="url(#lit)"/>
  </g>
</svg>
