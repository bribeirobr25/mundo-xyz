<svg xmlns="http://www.w3.org/2000/svg" width="440" height="480" viewBox="0 0 110 120">
  <defs>
    <radialGradient id="rim" gradientUnits="userSpaceOnUse" cx="55" cy="48" r="30.5">
      <stop offset="0.94" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lit" gradientUnits="userSpaceOnUse" cx="38" cy="31" r="20">
      <stop offset="0" stop-color="{{lit}}"/>
      <stop offset="0.28" stop-color="{{lit}}" stop-opacity="0.92"/>
      <stop offset="0.62" stop-color="{{lit}}" stop-opacity="0.28"/>
      <stop offset="1" stop-color="{{lit}}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" gradientUnits="userSpaceOnUse" cx="35" cy="27" r="7">
      <stop offset="0" stop-color="{{lit}}"/>
      <stop offset="0.55" stop-color="{{lit}}" stop-opacity="0.7"/>
      <stop offset="1" stop-color="{{lit}}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blotA" gradientUnits="userSpaceOnUse" cx="63" cy="38" r="12">
      <stop offset="0" stop-color="{{blot}}" stop-opacity="0.85"/>
      <stop offset="1" stop-color="{{blot}}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blotB" gradientUnits="userSpaceOnUse" cx="46" cy="58" r="11">
      <stop offset="0" stop-color="{{blot}}" stop-opacity="0.55"/>
      <stop offset="1" stop-color="{{blot}}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadeA" gradientUnits="userSpaceOnUse" cx="70" cy="60" r="18">
      <stop offset="0" stop-color="{{leafShade}}"/>
      <stop offset="0.55" stop-color="{{leafShade}}" stop-opacity="0.72"/>
      <stop offset="1" stop-color="{{leafShade}}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadeB" gradientUnits="userSpaceOnUse" cx="48" cy="66" r="13">
      <stop offset="0" stop-color="{{leafShade}}" stop-opacity="0.8"/>
      <stop offset="1" stop-color="{{leafShade}}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadeC" gradientUnits="userSpaceOnUse" cx="74" cy="44" r="9">
      <stop offset="0" stop-color="{{leafShade}}" stop-opacity="0.55"/>
      <stop offset="1" stop-color="{{leafShade}}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cast" gradientUnits="userSpaceOnUse" cx="62" cy="105" r="26">
      <stop offset="0" stop-color="{{shadow}}" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="{{shadow}}" stop-opacity="0.16"/>
      <stop offset="1" stop-color="{{shadow}}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="contact" gradientUnits="userSpaceOnUse" cx="55" cy="101" r="9">
      <stop offset="0" stop-color="{{shadow}}" stop-opacity="0.55"/>
      <stop offset="1" stop-color="{{shadow}}" stop-opacity="0"/>
    </radialGradient>
    <filter id="mottle" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="4" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.45  0 0 0 0 0.16  0 0 0 0.1 0" result="tint"/>
      <feBlend in="SourceGraphic" in2="tint" mode="multiply"/>
    </filter>
    <mask id="soft" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="110" height="120" fill="#000000"/>
      <circle cx="55" cy="48" r="30.5" fill="url(#rim)"/>
    </mask>
  </defs>
  <ellipse cx="62" cy="105" rx="22" ry="7" fill="url(#cast)"/>
  <ellipse cx="55" cy="101" rx="8" ry="3" fill="url(#contact)"/>
  <polygon points="56.2,76 58.6,76 57.4,102 56.2,102" fill="{{trunkShade}}"/>
  <polygon points="51.6,76 57.4,76 56.2,102 53.2,102" fill="{{trunk}}"/>
  <g mask="url(#soft)" filter="url(#mottle)">
    <circle cx="55" cy="48" r="30.5" fill="{{leaf}}"/>
    <circle cx="70" cy="60" r="18" fill="url(#shadeA)"/>
    <circle cx="48" cy="66" r="13" fill="url(#shadeB)"/>
    <circle cx="74" cy="44" r="9" fill="url(#shadeC)"/>
    <circle cx="63" cy="38" r="12" fill="url(#blotA)"/>
    <circle cx="46" cy="58" r="11" fill="url(#blotB)"/>
    <circle cx="38" cy="31" r="20" fill="url(#lit)"/>
    <circle cx="35" cy="27" r="7" fill="url(#core)"/>
  </g>
</svg>
