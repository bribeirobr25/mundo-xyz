name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test
          POSTGRES_DB: mundo_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:local-test@localhost:5432/mundo_test
      RUN_MODE: local-test
    steps:
      # A depth-1 checkout of the pull-request merge commit has no origin/main,
      # and that merge commit is committed by GitHub, which the privacy gate rejects.
      # Fetch the full history, name the base origin/main, and check out the head.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out the pull request head for the privacy range
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          git checkout --detach "${{ github.event.pull_request.head.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: node scripts/privacy-gate.mjs ci
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
